name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Paket yöneticisi npm'dir (package-lock.json). Node 22 ile gelen npm 10 desteklenmez;
# Node 22 işlerinde npm 11'e yükseltilir (Node 24 zaten npm 11 ile gelir).
jobs:
  kurulum-testleri:
    name: Kurulum testleri (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: npm 11'e yükselt
        shell: bash
        run: |
          npm install -g npm@11
          npm --version

      - name: Bağımlılıkları kur (npm ci)
        shell: bash
        run: |
          start=$(date +%s)
          npm ci
          echo "npm ci süresi: $(( $(date +%s) - start )) sn"

      - name: Kurulum başlatıcı ve paket yöneticisi testleri
        run: npm run test:setup

      - name: Yükseltme testleri
        run: npm run test:upgrade

      # Boş dizinde arayüzsüz (CLI) kurulum: migration, yönetici, .env, kilit ve durum dosyası.
      - name: Arayüzsüz kurulum duman testi
        env:
          QUIZMASTER_ADMIN_EMAIL: ci@okul.test
          QUIZMASTER_ADMIN_PASSWORD: Ci-Test-Parola-2026x
        run: npm run setup:cli -- --yes

      - name: Kurulum çıktılarını doğrula
        shell: bash
        run: |
          for f in server/.env server/data/installation.lock server/data/installation.state.json server/data/quiz.db; do
            test -s "$f" || { echo "Eksik: $f"; exit 1; }
          done
          node -e "const s=JSON.parse(require('fs').readFileSync('server/data/installation.state.json','utf8'));const bad=Object.entries(s.steps).filter(([,v])=>!['done','skipped'].includes(v.status));if(bad.length){console.error('Bitmemiş adım:',bad);process.exit(1)}"

      - name: İkinci çalıştırma kurulu sistemi bozmadan reddedilmeli
        shell: bash
        env:
          QUIZMASTER_ADMIN_EMAIL: ci@okul.test
          QUIZMASTER_ADMIN_PASSWORD: Ci-Test-Parola-2026x
        run: |
          if npm run setup:cli -- --yes; then echo "Kurulu sistemde ikinci kurulum başarılı olmamalıydı"; exit 1; fi
          test -s server/.env

  tip-denetimi:
    name: Tip denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm 11'e yükselt
        run: npm install -g npm@11

      - name: Bağımlılıkları kur (npm ci)
        run: npm ci

      - name: Sunucu tip denetimi
        run: npm run type-check --workspace=server

      - name: İstemci tip denetimi
        run: npm run type-check --workspace=client

  # Backend + frontend birim testleri (Chromium: arşiv PDF testleri için).
  birim-testleri:
    name: Birim testleri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm 11'e yükselt
        run: npm install -g npm@11

      - name: Bağımlılıkları kur (npm ci)
        run: npm ci

      # Arşiv/PDF testleri Chromium ister; kurulum sırasında indirilmez (isteğe bağlı bileşen).
      - name: Chromium (arşiv testleri için)
        run: |
          sudo env "PATH=$PATH" node node_modules/playwright/cli.js install-deps chromium
          node node_modules/playwright/cli.js install chromium

      - name: Backend testleri
        run: npm run test --workspace=server

      - name: Frontend testleri
        run: npm run test --workspace=client -- --run

      # Yalıtılmış dizinde üretim derlemesi + gerçek migration + yerel Sharp ile başlatma + CSRF.
      - name: Üretim derleme ve başlatma testi
        run: npm run test:build-startup

      # Kapı: kritik (critical) açık olmamalı. Yüksek açıklar bilinen durumdur, kapıyı kırmaz.
      - name: Güvenlik denetimi (kritik açık olmamalı)
        run: npm audit --omit=dev --audit-level=critical
